<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CoughSense — Respiratory Screening</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>CoughSense</h1>
      <p class="tagline">AI-assisted respiratory pre-screening (prototype)</p>
    </header>

    <main class="card">
      <form id="screening-form">
        <label class="field">
          <span>Upload cough audio (WAV)</span>
          <input type="file" id="audio" name="audio" accept="audio/*" required>
        </label>

        <div class="row">
          <label class="field small">
            <span>Age</span>
            <input type="number" id="age" name="age" min="0" max="120" required>
          </label>

          <label class="field small">
            <span>Gender</span>
            <select id="gender" name="gender" required>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </label>

          <label class="field small">
            <span>Smoking</span>
            <select id="smoker" name="smoker">
              <option value="n">No</option>
              <option value="y">Yes</option>
              <option value="">Prefer not to say</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button id="submit-btn" type="submit" class="primary">Run Screening</button>
        </div>
      </form>

      <div id="result" class="result" hidden>
        <h2>Screening Result</h2>
        <p id="probability"></p>
        <p id="recommendation" class="recommendation"></p>
        <p id="message" class="message"></p>
        <p class="disclaimer">CoughSense is a screening aid, not a medical diagnosis.</p>
      </div>

      <div id="error" class="error" hidden></div>
    </main>

    <footer class="footer card">
      <p>Cause cannot be determined from this screening. For any health concerns, seek professional medical advice.</p>
    </footer>
  </div>

  <script src="/static/js/script.js"></script>
</body>
</html>
